name: Reportar una falla
description: Registrar una falla reproducible sin exponer información confidencial.
title: "[Falla] "
labels: [falla]
body:
  - type: markdown
    attributes:
      value: |
        No adjunte transcripciones, minutas, credenciales ni datos identificables de clientes.

  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: "2.3.5"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Área afectada
      options:
        - Instalación
        - Interfaz gráfica
        - Lectura VTT/TXT/DOCX
        - Procesamiento local con Ollama
        - Revisión de elementos
        - Generación de Word
        - Base de datos o respaldos
        - Actualizaciones
        - Otra
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Explique qué ocurrió y qué esperaba que ocurriera.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir...
        2. Seleccionar...
        3. Procesar...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Entorno
      placeholder: "Windows 11, 16 GB RAM, Ollama..., modelo..."

  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmación de privacidad
      options:
        - label: Confirmo que eliminé o anonimicé toda información confidencial.
          required: true
