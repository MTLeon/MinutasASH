name: Reporte de error
description: Informar una falla reproducible de Minutas ASH
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Explique qué ocurrió y qué esperaba que ocurriera.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir...
        2. Seleccionar...
        3. Presionar...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: 2.3.4
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: Windows 11 24H2
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia sanitizada
      description: No adjunte transcripciones, datos personales ni información real de clientes.
  - type: checkboxes
    id: privacy
    attributes:
      label: Confidencialidad
      options:
        - label: Confirmo que eliminé datos sensibles de la evidencia.
          required: true
