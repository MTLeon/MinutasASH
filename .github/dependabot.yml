version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    # Pydantic fija una versión exacta de pydantic-core. El núcleo se actualiza
    # junto con Pydantic durante la regeneración controlada del lock de build.
    ignore:
      - dependency-name: "pydantic-core"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
