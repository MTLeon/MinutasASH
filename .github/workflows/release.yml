name: Construir instalador

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  instalador-windows:
    name: Instalador Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build-lock.txt

      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Construir y validar instalador
        shell: powershell
        run: .\build_tools\Build-Installer.ps1

      - name: Publicar artefactos de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: MinutasASH-${{ github.ref_name }}
          path: |
            dist_installer/MinutasASH_Setup_*_Online.exe
            dist_installer/MinutasASH_Setup_*_Online_SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Crear Release de GitHub para la etiqueta
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist_installer\MinutasASH_Setup_*_Online.exe | Select-Object -First 1
          $hash = Get-ChildItem dist_installer\MinutasASH_Setup_*_Online_SHA256.txt | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $setup.FullName $hash.FullName `
            --verify-tag `
            --title "MinutasASH ${{ github.ref_name }}" `
            --notes-file docs/NOTAS_VERSION_2.3.5.md
