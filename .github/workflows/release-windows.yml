name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Validar versión del tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $expected = "v$version"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "El tag ${{ github.ref_name }} no coincide con VERSION.txt ($expected)."
          }
      - name: Importar certificado de firma
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
          CODE_SIGNING_THUMBPRINT: ${{ secrets.CODE_SIGNING_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGNING_PFX_BASE64)) {
            throw "Falta el secreto CODE_SIGNING_PFX_BASE64 requerido para publicar una release firmada."
          }
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGNING_PFX_PASSWORD)) {
            throw "Falta el secreto CODE_SIGNING_PFX_PASSWORD requerido para importar el certificado."
          }
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGNING_THUMBPRINT)) {
            throw "Falta el secreto CODE_SIGNING_THUMBPRINT requerido para validar el certificado."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "minutas-signing.pfx"
          $importedThumbprints = @()
          $trustEntries = @()
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:CODE_SIGNING_PFX_BASE64)
            )
            $password = ConvertTo-SecureString $env:CODE_SIGNING_PFX_PASSWORD -AsPlainText -Force
            $imported = Import-PfxCertificate -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $importedThumbprints = @($imported | ForEach-Object Thumbprint)
            $privateCertificates = @($imported | Where-Object HasPrivateKey)
            if ($privateCertificates.Count -ne 1) {
              throw "El PFX debe contener exactamente un certificado con clave privada."
            }
            $certificate = $privateCertificates[0]
            $expectedThumbprint = $env:CODE_SIGNING_THUMBPRINT.Replace(" ", "").ToUpperInvariant()
            if ($certificate.Thumbprint.ToUpperInvariant() -ne $expectedThumbprint) {
              throw "La huella importada no coincide con CODE_SIGNING_THUMBPRINT."
            }
            if ($certificate.Subject -ne "CN=ASH SIPROI Internal Code Signing") {
              throw "El sujeto del certificado de firma no es el esperado."
            }

            $isSelfSigned = $certificate.Subject -eq $certificate.Issuer
            if ($isSelfSigned) {
              # Trust only the public copy; keep the private key confined to CurrentUser\My.
              $chainCertificates = @(
                [Security.Cryptography.X509Certificates.X509Certificate2]::new(
                  $certificate.RawData
                )
              )
            } else {
              $chain = [Security.Cryptography.X509Certificates.X509Chain]::new()
              $chain.ChainPolicy.RevocationMode = "NoCheck"
              foreach ($candidate in @($imported)) {
                if ($candidate.Thumbprint -ne $certificate.Thumbprint) {
                  [void]$chain.ChainPolicy.ExtraStore.Add($candidate)
                }
              }
              [void]$chain.Build($certificate)
              $chainCertificates = @(
                $chain.ChainElements | ForEach-Object Certificate |
                  Where-Object Thumbprint -NE $certificate.Thumbprint
              )
              if ($chainCertificates.Count -eq 0) {
                throw "El PFX no contiene la cadena necesaria para validar la firma."
              }
            }
            foreach ($chainCertificate in $chainCertificates) {
              $storeName = if ($chainCertificate.Subject -eq $chainCertificate.Issuer) {
                "Root"
              } else {
                "CA"
              }
              $store = [Security.Cryptography.X509Certificates.X509Store]::new(
                $storeName,
                [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
              )
              try {
                $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
                $store.Add($chainCertificate)
              }
              finally {
                $store.Close()
              }
              $trustEntries += "$storeName|$($chainCertificate.Thumbprint)"
            }

            $verificationChain = [Security.Cryptography.X509Certificates.X509Chain]::new()
            $verificationChain.ChainPolicy.RevocationMode = "NoCheck"
            if (-not $verificationChain.Build($certificate)) {
              $statuses = @($verificationChain.ChainStatus | ForEach-Object Status) -join ", "
              throw "La cadena temporal de firma no quedó confiable: $statuses"
            }

            "MINUTAS_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MINUTAS_IMPORTED_MY_THUMBPRINTS=$($importedThumbprints -join ';')" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MINUTAS_IMPORTED_TRUST_ENTRIES=$($trustEntries -join ';')" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          catch {
            foreach ($entry in $trustEntries) {
              $parts = $entry.Split("|", 2)
              Remove-Item -LiteralPath "Cert:\CurrentUser\$($parts[0])\$($parts[1])" `
                -Force -ErrorAction SilentlyContinue
            }
            foreach ($thumbprint in $importedThumbprints) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" `
                -Force -ErrorAction SilentlyContinue
            }
            throw
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Construir y probar
        shell: pwsh
        run: .\build_tools\Build-Complete-Installer.ps1

      - name: Generar manifiesto de release
        shell: pwsh
        run: |
          . .\build_tools\Release.ps1
          New-MinutasReleaseManifest -Root $PWD `
            -OutputPath .\dist_installer\MinutasASH_RELEASE_MANIFEST.json `
            -Commit "${{ github.sha }}"

      - name: Publicar artefacto de validación
        uses: actions/upload-artifact@v7
        with:
          name: MinutasASH-Setup-${{ github.sha }}
          path: |
            dist_installer/*.exe
            dist_installer/*SHA256*.txt
            dist_installer/*.sha256
            dist_installer/*MANIFEST*.json
          retention-days: 30

      - name: Crear o actualizar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content VERSION.txt -Raw).Trim()
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Minutas ASH $tag" --generate-notes
          }
          $releaseFiles = @(
            Get-ChildItem dist_installer\*.exe, dist_installer\*SHA256*.txt,
              dist_installer\*.sha256, dist_installer\*MANIFEST*.json
            Get-Item docs\Manual_Maestro_2.3.3.md, docs\Manual_Usuario_2.3.3.md,
              docs\Manual_Configuracion_2.3.3.md, docs\Manual_Programador_2.3.3.md
            Get-Item "docs\NOTAS_VERSION_$version.md", "docs\VALIDACION_$version.md"
            Get-Item plantillas\Plantilla_Marcadores_ASH_2.3.docx
          ) | ForEach-Object FullName
          gh release upload $tag @releaseFiles --clobber

      - name: Retirar certificado temporal
        if: always()
        shell: pwsh
        run: |
          foreach ($entry in @($env:MINUTAS_IMPORTED_TRUST_ENTRIES -split ";" |
              Where-Object { $_ })) {
            $parts = $entry.Split("|", 2)
            Remove-Item -LiteralPath "Cert:\CurrentUser\$($parts[0])\$($parts[1])" `
              -Force -ErrorAction SilentlyContinue
          }
          foreach ($thumbprint in @($env:MINUTAS_IMPORTED_MY_THUMBPRINTS -split ";" |
              Where-Object { $_ })) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" `
              -Force -ErrorAction SilentlyContinue
          }
