name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Validar versión del tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $expected = "v$version"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "El tag ${{ github.ref_name }} no coincide con VERSION.txt ($expected)."
          }

      - name: Construir y probar
        shell: pwsh
        run: .\build_tools\Build-Installer.ps1

      - name: Publicar artefacto de validación
        uses: actions/upload-artifact@v4
        with:
          name: MinutasASH-Setup-${{ github.ref_name }}
          path: |
            dist_installer/*.exe
            dist_installer/*SHA256*.txt
          retention-days: 30

      - name: Crear o actualizar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Minutas ASH $tag" --generate-notes
          }
          gh release upload $tag dist_installer\*.exe dist_installer\*SHA256*.txt docs\Manual_Maestro_2.3.3.md docs\Manual_Usuario_2.3.3.md docs\Manual_Configuracion_2.3.3.md docs\Manual_Programador_2.3.3.md plantillas\Plantilla_Marcadores_ASH_2.3.docx --clobber
