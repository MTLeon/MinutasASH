name: Validación continua

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas-windows:
    name: Python 3.12 / Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verificar sintaxis
        run: python -m compileall -q src tests

      - name: Ejecutar pruebas
        run: python -m pytest -q --cov=src --cov-report=term-missing --cov-report=xml

      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-python-${{ github.run_number }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
