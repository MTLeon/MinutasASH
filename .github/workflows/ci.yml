name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  tests:
    name: Tests Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Comprobar sintaxis
        run: python -m compileall -q src tests

      - name: Ruff
        run: python -m ruff check .

      - name: Pruebas y cobertura
        run: python -m pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Publicar cobertura
        if: always() && matrix.os == 'windows-latest' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
