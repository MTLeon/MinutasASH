name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias de construcción
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build-lock.txt

      - name: Ejecutar pruebas
        run: python -m pytest -q

      - name: Construir aplicación PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean MinutasASH.spec

      - name: Publicar aplicación Windows
        uses: actions/upload-artifact@v7
        with:
          name: MinutasASH-Windows-${{ github.sha }}
          path: dist/MinutasASH/
          retention-days: 30
